name: fixture

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The SDK the fixture solution is built and compared with; blaze-cs itself always builds on global.json's.
        sdk: ['10.0.x', '11.0.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.sdk }}
          dotnet-quality: preview
      - uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task build
      - shell: bash
        # The fixture copy (and its daemon log) under runner.temp on both OSes: Path.GetTempPath reads TMP on Windows, TMPDIR elsewhere.
        # Windows goes through the script task check:windows runs there, so CI covers it too.
        run: |
          export TMP="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP"
          version="$(dotnet --list-sdks | grep "^${SDK%.x}" | tail -1 | cut -d' ' -f1)"
          if [ "$RUNNER_OS" = Windows ]; then
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/check-windows.ps1 "$DOTNET_ROOT" "$version"
          else
            BLAZE_CS_SDK="$version" dotnet run tests/fixture/check.cs
          fi
        env:
          SDK: ${{ matrix.sdk }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daemon-log-${{ matrix.os }}-${{ matrix.sdk }}
          path: ${{ runner.temp }}/blaze-cs-fixture/.blaze-cs/daemon.log
          if-no-files-found: ignore
