name: fixture

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    # A hung step fails the job instead of holding a runner for hours; a whole check takes 10 to 20 minutes.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The SDK the fixture solution is built and compared with; blaze-cs itself always builds on global.json's.
        sdk: ['10.0.100', '10.0.x', '11.0.x']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.sdk }}
          dotnet-quality: preview
      # One packages folder for blaze-cs and the fixture copy (restored from the temp dir), so both hit the cache.
      - shell: bash
        run: echo "NUGET_PACKAGES=$RUNNER_TEMP/nuget-packages" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/nuget-packages
          key: nuget-${{ runner.os }}-${{ matrix.sdk }}-${{ hashFiles('global.json', '**/*.csproj', '**/*.props') }}
          restore-keys: nuget-${{ runner.os }}-${{ matrix.sdk }}-
      - uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # The build compiles the native client; ubuntu-latest has clang, but not always zlib's headers.
      - name: Install the native client's toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends clang zlib1g-dev
      - run: task build
      - run: task test
      - run: task pack
      - uses: actions/upload-artifact@v7
        with:
          name: blaze-cs-tool-${{ matrix.os }}-${{ matrix.sdk }}
          path: artifacts/packages/*.nupkg
      - name: Install the packed tool
        shell: bash
        # The fixture check below runs this installed copy, not the build in artifacts/bin (BLAZE_CS).
        run: |
          dotnet tool install blaze-cs --tool-path "$RUNNER_TEMP/blaze-cs-tool" --add-source artifacts/packages
          exe=blaze-cs
          if [ "$RUNNER_OS" = Windows ]; then exe=blaze-cs.exe; fi
          echo "BLAZE_CS=$RUNNER_TEMP/blaze-cs-tool/$exe" >> "$GITHUB_ENV"
      - shell: bash
        # Twice: through the installed tool (managed only), then through the launcher in the clone, which runs
        # the native client built by task build. Each leg's check includes the daemon handshake.
        # The fixture copy (and its daemon logs) under runner.temp on both OSes: Path.GetTempPath reads TMP on Windows, TMPDIR elsewhere.
        # Windows goes through the script task check:windows runs there, so CI covers it too.
        run: |
          export TMP="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP"
          version="$(dotnet --list-sdks | grep "^${SDK%.x}" | tail -1 | cut -d' ' -f1)"
          for launcher in "$BLAZE_CS" ""; do
            echo "::group::fixture check through ${launcher:-the native launcher}"
            if [ "$RUNNER_OS" = Windows ]; then
              BLAZE_CS="$launcher" powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/check-windows.ps1 "$DOTNET_ROOT" "$version"
            else
              BLAZE_CS="$launcher" BLAZE_CS_SDK="$version" dotnet run tests/fixture/check.cs
            fi
            echo "::endgroup::"
          done
        env:
          SDK: ${{ matrix.sdk }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: daemon-log-${{ matrix.os }}-${{ matrix.sdk }}
          path: ${{ runner.temp }}/blaze-cs-fixture/.blaze-cs/daemon*.log
          # .blaze-cs is hidden, and upload-artifact skips hidden files unless told.
          include-hidden-files: true
          if-no-files-found: ignore
