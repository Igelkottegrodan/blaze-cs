name: fixture

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The SDK the fixture solution is built and compared with; blaze-cs itself always builds on global.json's.
        sdk: ['10.0.x', '11.0.x']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.sdk }}
          dotnet-quality: preview
      # One packages folder for blaze-cs and the fixture copy (restored from the temp dir), so both hit the cache.
      - shell: bash
        run: echo "NUGET_PACKAGES=$RUNNER_TEMP/nuget-packages" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/nuget-packages
          key: nuget-${{ runner.os }}-${{ matrix.sdk }}-${{ hashFiles('global.json', '**/*.csproj', '**/*.props') }}
          restore-keys: nuget-${{ runner.os }}-${{ matrix.sdk }}-
      - uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task build
      - run: task test
      - shell: bash
        # The fixture copy (and its daemon log) under runner.temp on both OSes: Path.GetTempPath reads TMP on Windows, TMPDIR elsewhere.
        # Windows goes through the script task check:windows runs there, so CI covers it too.
        run: |
          export TMP="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP"
          version="$(dotnet --list-sdks | grep "^${SDK%.x}" | tail -1 | cut -d' ' -f1)"
          if [ "$RUNNER_OS" = Windows ]; then
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/check-windows.ps1 "$DOTNET_ROOT" "$version"
          else
            BLAZE_CS_SDK="$version" dotnet run tests/fixture/check.cs
          fi
        env:
          SDK: ${{ matrix.sdk }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: daemon-log-${{ matrix.os }}-${{ matrix.sdk }}
          path: ${{ runner.temp }}/blaze-cs-fixture/.blaze-cs/daemon.log
          if-no-files-found: ignore
